name: Build Android APK

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v5

    - name: Configurer Java (JDK 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # gradlew n'est pas dans le dépôt : on installe Gradle directement
    # (même version que gradle/wrapper/gradle-wrapper.properties)
    - name: Installer Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: '9.3.1'

    # debug.keystore est dans le .gitignore, mais build.gradle.kts l'exige
    - name: Générer la clé de debug
      run: |
        keytool -genkeypair -v \
          -keystore debug.keystore \
          -storepass android -keypass android \
          -alias androiddebugkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Compiler l'APK (Debug)
      run: gradle assembleDebug --stacktrace

    - name: Sauvegarder l'APK (Artifact)
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
